<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYST 2.0</title>
    <meta name="description" content="MYST 2.0 - Management of Yoga Sports & Tournaments">
    <meta name="theme-color" content="#030712">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../resources/MYST_dp.jpeg" onerror="this.href='https://www.soumenyoga.in/resources/MYST_dp.jpeg'">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Subtle background dot pattern */
        .bg-dots {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Ambient spotlight */
        .ambient-glow {
            background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(59, 130, 246, 0.14), transparent);
        }

        /* Card transition */
        .option-card {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .option-card:hover {
            transform: translateY(-4px);
        }
        @media (max-width: 640px) {
            .option-card:hover {
                transform: none;
            }
        }
    </style>
</head>

<body class="bg-gray-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white bg-dots relative overflow-x-hidden">

    <!-- Ambient Glow -->
    <div class="absolute top-0 left-0 right-0 h-96 ambient-glow pointer-events-none z-0"></div>

    <!-- MINIMALIST HEADER -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl overflow-hidden border border-white/10 bg-gray-900 flex items-center justify-center shrink-0 shadow-sm">
                <img src="../resources/MYST_dp.jpeg" 
                     alt="MYST Logo" 
                     class="w-full h-full object-cover"
                     onerror="this.onerror=null; this.src='https://www.soumenyoga.in/resources/MYST_dp.jpeg';">
            </div>
            <span class="text-base sm:text-lg font-black tracking-tight text-white uppercase leading-none">
                MYST <span class="text-blue-500 font-black">2.0</span>
            </span>
        </div>

        <a href="../index.html" 
           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-white/[0.05] border border-white/[0.08] transition-colors">
            <span>Main Site</span>
            <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
        </a>
    </header>

    <!-- CENTERED 3 OPTIONS LAUNCHER -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
        
        <!-- Subtle Title -->
        <div class="text-center mb-8 sm:mb-12">
            <h1 class="text-2xl sm:text-4xl font-black text-white tracking-tight uppercase mb-2">
                Select Screen
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 font-medium">
                Choose an option to continue
            </p>
        </div>

        <!-- 5 OPTIONS: ONLY ICON & NAME -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 sm:gap-5 w-full max-w-5xl">

            <!-- OPTION 1: ADMIN -->
            <a href="main/admin.html" 
               class="option-card group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-slate-900/40 hover:bg-slate-900/90 border border-white/[0.08] hover:border-blue-500/50 backdrop-blur-sm shadow-sm hover:shadow-xl hover:shadow-blue-950/40 text-center focus:outline-none focus:ring-2 focus:ring-blue-500 sm:col-span-2 lg:col-span-1">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-blue-500 group-hover:text-white transition-all shadow-inner">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-blue-400 transition-colors">
                    Admin
                </span>
            </a>

            <!-- OPTION 2: DISPLAY -->
            <a href="main/display.html" 
               class="option-card group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-slate-900/40 hover:bg-slate-900/90 border border-white/[0.08] hover:border-amber-500/50 backdrop-blur-sm shadow-sm hover:shadow-xl hover:shadow-amber-950/40 text-center focus:outline-none focus:ring-2 focus:ring-amber-500">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-gray-950 transition-all shadow-inner">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-amber-400 transition-colors">
                    Display
                </span>
            </a>

            <!-- OPTION 3: JUDGE -->
            <a href="main/judge.html" 
               class="option-card group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-slate-900/40 hover:bg-slate-900/90 border border-white/[0.08] hover:border-emerald-500/50 backdrop-blur-sm shadow-sm hover:shadow-xl hover:shadow-emerald-950/40 text-center focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-emerald-500 group-hover:text-white transition-all shadow-inner">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-emerald-400 transition-colors">
                    Judge
                </span>
            </a>

            <!-- OPTION 4: CULT DISPLAY -->
            <a href="main/cult-display.html" 
               class="option-card group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-slate-900/40 hover:bg-slate-900/90 border border-white/[0.08] hover:border-indigo-500/50 backdrop-blur-sm shadow-sm hover:shadow-xl hover:shadow-indigo-950/40 text-center focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-indigo-500 group-hover:text-white transition-all shadow-inner">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-indigo-400 transition-colors">
                    Cult Display
                </span>
            </a>

            <!-- OPTION 5: CULT JUDGE -->
            <a href="main/cult-judge.html" 
               class="option-card group flex flex-col items-center justify-center p-6 sm:p-8 rounded-2xl bg-slate-900/40 hover:bg-slate-900/90 border border-white/[0.08] hover:border-purple-500/50 backdrop-blur-sm shadow-sm hover:shadow-xl hover:shadow-purple-950/40 text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-purple-500 group-hover:text-white transition-all shadow-inner">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </div>
                <span class="text-base sm:text-lg font-bold text-white tracking-tight group-hover:text-purple-400 transition-colors">
                    Cult Judge
                </span>
            </a>

        </div>

    </main>

    <!-- MINIMALIST FOOTER -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-500 font-medium">
        &copy; 2026 Vivekananda Yoga Training Center
    </footer>

    <!-- KEYBOARD SHORTCUTS (1: Admin, 2: Display, 3: Judge, 4: Cult Display, 5: Cult Judge) -->
    <script>
        document.addEventListener('keydown', function (e) {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

            const key = e.key.toLowerCase();
            if (key === '1' || key === 'a') {
                window.location.href = 'main/admin.html';
            } else if (key === '2' || key === 'd') {
                window.location.href = 'main/display.html';
            } else if (key === '3' || key === 'j') {
                window.location.href = 'main/judge.html';
            } else if (key === '4') {
                window.location.href = 'main/cult-display.html';
            } else if (key === '5') {
                window.location.href = 'main/cult-judge.html';
            }
        });
    </script>

</body>
</html>
